name: release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida o YAML
        run: python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('themes/*.yaml')]; print('ok')"
      - name: Cria a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$V" >/dev/null 2>&1; then echo "$V já existe"; exit 0; fi
          awk -v v="${V#v}" '$0 ~ "^## "v"( |$)"{f=1;next} /^## /{f=0} f' CHANGELOG.md > notas.md
          gh release create "$V" --target "$GITHUB_SHA" --title "$V" --notes-file notas.md
